services:
  redis:
    image: redis:7-alpine
    container_name: memorylink-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: memorylink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: memorylink
      MINIO_ROOT_PASSWORD: memorylink123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  miniodata:























