spring:
  application:
    name: memorylink-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memorylink?currentSchema=memorylink}
    username: ${DB_USER:memorylink}
    password: ${DB_PASSWORD:memorylink}
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: memorylink
    open-in-view: false
  flyway:
    enabled: true
    schemas: memorylink
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

memorylink:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  jwt:
    secret: ${JWT_SECRET:please-change-me-in-production}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
